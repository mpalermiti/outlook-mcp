[project]
name = "outlook-graph-mcp"
version = "1.22.0"
description = "MCP server for Microsoft Outlook via Microsoft Graph API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Michael Palermiti" }
]
keywords = ["mcp", "outlook", "microsoft-graph", "email", "calendar", "openclaw"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp[cli]>=2",
    "msgraph-sdk>=1.55",
    # kiota 1.13.0 (2026-09-18) moved per-request options from a monkey-patched
    # `request.options` attribute to `request.extensions["kiota_request_options"]`.
    # msgraph-core 1.5.1 still reads the old attribute, so its UrlReplaceHandler
    # never rewrites `/users/me-token-to-replace` to `/me` and every /me call
    # 400s: "me-token-to-replace is invalid" (#80). The lock pins 1.12.3, which
    # is why CI and every developer install were green while a fresh
    # `uv tool install` broke. Lift these caps once a msgraph-core release
    # carries microsoftgraph/msgraph-sdk-python-core#1129.
    "microsoft-kiota-abstractions<1.13",
    "microsoft-kiota-http<1.13",
    "microsoft-kiota-authentication-azure<1.13",
    "microsoft-kiota-serialization-json<1.13",
    "azure-identity>=1.25",
    "pydantic>=2.0",
    # zoneinfo reads the host's IANA time zone database. Windows ships none at
    # all and slim Linux images (python:*-slim, Alpine) routinely omit
    # /usr/share/zoneinfo, so without this every relative-date path raises
    # ZoneInfoNotFoundError for a perfectly valid zone name.
    "tzdata",
]

[project.urls]
Homepage = "https://github.com/mpalermiti/outlook-mcp"
Repository = "https://github.com/mpalermiti/outlook-mcp"
Issues = "https://github.com/mpalermiti/outlook-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
outlook-mcp = "outlook_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/outlook_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run is the offline unit suite. The credentialed tiers are opt-in via
# `-m integration` / `-m live` (a CLI -m overrides this one). Without this they
# run for real on any machine that happens to hold a cached token, and merely
# *skip* in CI — which reads as "covered" when nothing was exercised.
addopts = "-m 'not integration and not live and not live_write'"
markers = [
    "integration: marks tests that require real Azure AD auth (deselect with '-m \"not integration\"')",
    "live: query-shape guards that call real Graph — the mock suite cannot see a query Graph rejects or mis-evaluates (run with '-m live'; see RELEASING.md)",
    "live_write: the one tier that WRITES to a real calendar — creates and deletes events to prove Graph accepts a payload the mocks can only assert we built (run with '-m live_write' AND OUTLOOK_MCP_LIVE_WRITE=1; see tests/conftest.py)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]
