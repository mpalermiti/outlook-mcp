[project]
name = "outlook-graph-mcp"
version = "1.30.1"
description = "MCP server for Microsoft Outlook via Microsoft Graph API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Michael Palermiti" }
]
keywords = ["mcp", "outlook", "microsoft-graph", "email", "calendar", "openclaw"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp[cli]>=2",
    "uvicorn>=0.30",
    "msgraph-sdk>=1.55",
    # A floor, not a cap. kiota 1.13.0 (2026-09-18) moved per-request options
    # from a monkey-patched `request.options` attribute to
    # `request.extensions["kiota_request_options"]`. msgraph-core 1.5.1 still
    # reads the old attribute, so its UrlReplaceHandler never rewrites
    # `/users/me-token-to-replace` to `/me` and every /me call 400s:
    # "me-token-to-replace is invalid" (#80). 1.22.1 capped kiota below 1.13;
    # msgraph-core 1.5.2 carries the fix (microsoftgraph/msgraph-sdk-python-core#1129)
    # and requires kiota >= 1.13. msgraph-sdk itself accepts msgraph-core 1.5.1,
    # and 1.5.1 accepts kiota 1.13+, so without this floor a resolver can still
    # pair the new kiota with the broken core. tests/test_me_rewrite_reaches_the_wire.py
    # checks the rewrite against whatever an install resolves.
    "msgraph-core>=1.5.2",
    "azure-identity>=1.25",
    "pydantic>=2.0",
    # zoneinfo reads the host's IANA time zone database. Windows ships none at
    # all and slim Linux images (python:*-slim, Alpine) routinely omit
    # /usr/share/zoneinfo, so without this every relative-date path raises
    # ZoneInfoNotFoundError for a perfectly valid zone name.
    "tzdata",
    # Not imported here, but it is the trust store: msal (via requests) and httpx
    # verify login.microsoftonline.com and graph.microsoft.com against certifi's
    # bundle. Before 2026.10.19 that bundle trusts emSign ECC Root CA - G3, whose
    # intermediate CA keys were stolen (GHSA-6q48-6c7w-9gw2). Nothing upstream
    # sets a minimum, so without this an upgrade keeps the old bundle.
    # tests/test_trust_store_excludes_compromised_roots.py checks what loads.
    "certifi>=2026.10.19",
]

[project.urls]
Homepage = "https://github.com/mpalermiti/outlook-mcp"
Repository = "https://github.com/mpalermiti/outlook-mcp"
Issues = "https://github.com/mpalermiti/outlook-mcp/issues"

[project.optional-dependencies]
documents = [
    "psutil>=7,<8",
    "pypdf>=6.21.2,<7",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # The same range in both places: CI fails any file `ruff format` would change,
    # so the formatter version is part of the contract. 0.15 and 0.16 format this
    # tree identically (0.8 and older reformat 7 files). Ruff changes its stable
    # style, and can add rules to the selected sets, only in minor releases: lift
    # the cap once the next minor passes `ruff format --check` and `ruff check`
    # on src/ tests/ scripts/ (#78).
    "ruff>=0.15.10,<0.17",
]

[project.scripts]
outlook-mcp = "outlook_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/outlook_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run is the offline unit suite. The credentialed tiers are opt-in via
# `-m integration` / `-m live` (a CLI -m overrides this one). Without this they
# run for real on any machine that happens to hold a cached token, and merely
# *skip* in CI — which reads as "covered" when nothing was exercised.
addopts = "-m 'not integration and not live and not live_write'"
markers = [
    "integration: marks tests that require real Azure AD auth (deselect with '-m \"not integration\"')",
    "live: query-shape guards that call real Graph — the mock suite cannot see a query Graph rejects or mis-evaluates (run with '-m live'; see RELEASING.md)",
    "live_write: the one tier that WRITES to a real calendar — creates and deletes events to prove Graph accepts a payload the mocks can only assert we built (run with '-m live_write' AND OUTLOOK_MCP_LIVE_WRITE=1; see tests/conftest.py)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    # Same range as the dev extra above, and for the same reason.
    "ruff>=0.15.10,<0.17",
]
